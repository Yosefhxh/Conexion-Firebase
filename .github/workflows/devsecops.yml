name: DevSecOps Conexion-Firebase Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Código Fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Permite escanear todo el historial de commits

      # 1. CONTROL DE SEGURIDAD: Gestión de Secretos (TruffleHog)
      - name: Escaneo de Secretos en el Historial
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

      # 2. CONFIGURACIÓN DEL ENTORNO BASE
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias de la Aplicación
        run: npm ci

      # 3. CONTROL DE SEGURIDAD: SCA (Análisis de Dependencias de Terceros)
      - name: Auditoría de Dependencias Vulnerables (SCA)
        run: npm audit --audit-level=high # Rompe el pipeline si hay fallos Altos o Críticos

      # 4. CONTROL DE SEGURIDAD: SAST (Análisis de Código Estático)
      - name: Escaneo de Código Estático (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/security-audit # Reglas enfocadas en OWASP Top 10 y buenas prácticas de JS

  container-security:
    needs: security-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Código Fuente
        uses: actions/checkout@v4

      # 5. CONSTRUCCIÓN DEL ARTEFACTO
      - name: Construir Imagen de Contenedor Docker
        run: docker build -t conexion-firebase:prod .

      # 6. CONTROL DE SEGURIDAD: Seguridad de Contenedores (Trivy)
      - name: Análisis de Vulnerabilidades en Contenedor (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'conexion-firebase:prod'
          format: 'table'
          exit-code: '1'          # Seguirá rompiendo el pipeline si hay fallos reales corregibles
          ignore-unfixed: true    # IGNORA vulnerabilidades que los desarrolladores de software aún no han parchado
          vuln-type: 'os'         # Se enfoca en asegurar el Sistema Operativo del contenedor
          severity: 'CRITICAL,HIGH'

      - name: Reportar resultado de Trivy
        if: always()
        run: |
          if [ "${{ steps.trivy_scan.outcome }}" = "success" ]; then
            echo "Trivy finalizó correctamente y no encontró vulnerabilidades críticas o altas."
          elif [ "${{ steps.trivy_scan.outcome }}" = "failure" ]; then
            echo "::error::Trivy detectó vulnerabilidades críticas o altas en la imagen."
            exit 1
          else
            echo "Trivy no se ejecutó porque el build anterior falló o el paso fue omitido."
          fi
